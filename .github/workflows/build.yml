name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --console=plain
      - name: Collect jars
        run: |
          mkdir dist
          cp manager/build/libs/baritonebots-manager-*.jar dist/
          cp bot-mod/build/libs/baritonebots-botmod-*.jar dist/
          cp companion-plugin/build/libs/baritonebots-companion-*.jar dist/
      - uses: actions/upload-artifact@v4
        with:
          name: baritonebots-jars
          path: dist/*.jar
