# BaritoneBots companion plugin, English texts (UTF-8, MiniMessage markup, placeholders as <name> tags).
prefix=<dark_gray>[<aqua>BaritoneBots</aqua>]</dark_gray>
no-permission=<red>You do not have permission to do that.
usage=<yellow>Usage: /<label> status | reload | rollback [bot] [minutes] | journal [bot] [minutes] | token
reload.done=<green>Config reloaded (<warnings> warning(s), see the console).
reload.failed=<red>Reload failed: <error>
unknown-bot=<red>'<bot>' is not in the bots list in config.yml.
bad-minutes=<red>Minutes must be a whole number from 1 to <max>.

token.show=<gray>Bot token (click to copy): <token>
token.hover=Copy to clipboard
token.missing=<red>No token is set. Clear the token line in config.yml and run /bb reload to generate one.

status.header=<gray>Version <white><version></white>, language <white><language></white>
status.token-set=<gray>Token: <green>set</green> (/bb token)
status.token-missing=<gray>Token: <red>not set</red>
status.bots-none=<gray>Bots: <yellow>none in config.yml</yellow>
status.bot-verified=<gray> - <white><name></white>: <green>verified</green> (bot id <id>, mod <mod>, <minutes> min ago)
status.bot-online=<gray> - <white><name></white>: <yellow>online, not verified</yellow>
status.bot-offline=<gray> - <white><name></white>: offline
status.protect-on=<gray>Name protection: <green>on</green> (<rules>)
status.protect-off=<gray>Name protection: off
status.distances-on=<gray>Distances: <white><value></white>
status.distances-off=<gray>Distances: off
status.permissions=<gray>Permissions for bots: <white><value></white>
status.permissions-none=<gray>Permissions for bots: none
status.login-on=<gray>Force login: <green>on</green> (<value>)
status.login-off=<gray>Force login: off
status.login-none=<gray>Force login: on, but neither AuthMe nor nLogin is installed
status.journal-on=<gray>Journal: <green>on</green>, <days> day(s), <memory> in memory, <queued> queued, <written> written
status.journal-off=<gray>Journal: off
status.journal-error=<red>Journal write error: <error>
status.rollback-journal=<gray>Rollback: from the journal, <per_tick> blocks per tick, at most <max>
status.rollback-command=<gray>Rollback: console command <white>/<command></white>
status.rollback-unavailable=<gray>Rollback: <red>unavailable</red> (mode <mode>; see the console warnings)
status.rollback-running=<yellow>Rollback running: <value>

journal.disabled=<red>The journal is off (journal.enabled: false).
journal.result=<gray><white><bot></white>, last <minutes> min: <white><breaks></white> broken, <white><places></white> placed.
journal.entry=<dark_gray> <time></dark_gray> <action> <white><block></white> <gray><world> <x> <y> <z>
journal.action-break=<red>broke</red>
journal.action-place=<green>placed</green>
journal.error=<red>Could not read the journal: <error>

rollback.started=<gray>Rolling back <white><bot></white>, last <minutes> min...
rollback.done-journal=<green>Rollback of <bot> done: <restored> of <total> restored, <skipped> skipped (changed by someone else), <failed> failed.
rollback.done-command=<green>Rollback of <bot>: ran /<command>
rollback.failed=<red>Rollback of <bot> failed: <reason>

reason.busy=another rollback is still running
reason.unavailable=not available with the current config (journal off, or no rollback command)
reason.too_large=too many changes in this window; choose fewer minutes or raise rollback.max-blocks
reason.not_a_bot=the target is not in the bots list
reason.bad_minutes=minutes must be from 1 to <max>
reason.not_verified=this connection did not pass the token check
reason.cancelled=cancelled because the plugin was disabled
reason.command_failed=the rollback command failed, see the server console
reason.error=the journal files could not be read, see the server console

kick.protected-name=This name belongs to a bot and cannot join from your address.

notice.login-ok=Logged in by <plugin>.
notice.login-not-registered=The account is not registered in <plugin>; the bot has to /register once.
notice.login-failed=Force login through <plugin> failed: <reason>

reject.no_token=the server has no bot token configured
reject.bad_token=wrong token
reject.not_in_bots_list=this name is not in the bots list on the server
reject.token_changed=the server token changed
reject.removed=this name was removed from the bots list
